pre-commit:
  parallel: true
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: lint
      glob: '*.{ts,tsx,mjs,cjs}'
      run: npx eslint --max-warnings 0 {staged_files}
    - name: format
      glob: '*.{ts,tsx,mjs,cjs,json,md,yml}'
      run: npx prettier --check {staged_files}
    - name: no dashes
      run: npm run nodash
    - name: unit tests
      run: npm test

pre-push:
  jobs:
    - name: full check
      run: npm run check
