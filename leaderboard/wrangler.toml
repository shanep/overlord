# The Cloudflare Worker behind the Reputation leaderboard. Deploy with
# node scripts/deploy-leaderboard.mjs, which creates the database the first time.
name = "overlord-leaderboard"
main = "../src/leaderboard/worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "overlord-leaderboard"
database_id = "a1e333df-0bb6-4409-a787-025cffd4e6ad"
migrations_dir = "migrations"
